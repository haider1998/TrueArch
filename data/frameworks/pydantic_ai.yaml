curation:
  status: "curated"
  last_validated: "2026-05-16"
  validated_by: "founder"
  next_validation_due: "2026-06-16"
  confidence_override: null
  sources:
    - "https://github.com/pydantic/pydantic-ai"
    - "https://pypi.org/project/pydantic-ai/"
    - "https://ai.pydantic.dev"
  notes: |
    Verified May 16 2026: 17,100 GitHub stars. Latest: v1.97.0 (May 15 2026).
    Very high release velocity (v1.97 implies ~97 minor releases since launch).
    
    KEY DIFFERENTIATOR: Type-safety-first design built on Pydantic. Best-in-class for
    teams that value strict type validation and want their agents to be as type-safe as
    their APIs. Natural pairing with FastAPI.
    
    Primary strengths:
    - Strongest type safety of any orchestration framework
    - Clean, small API surface (60 public methods vs LangChain's 340)
    - FastAPI integration is near-frictionless
    - Backed by Pydantic team (proven reliability track record)
    
    Primary weaknesses:
    - Ecosystem much younger than LangGraph/CrewAI
    - No native multi-agent coordination
    - Limited production case studies
    
    TrueArch position: Recommend for type-safety-critical workflows and FastAPI-native teams.
    Strong for APIs and structured output generation. Less suitable for complex stateful multi-agent.
    Watch: Growing very fast — could become a primary recommendation within 6-12 months.
