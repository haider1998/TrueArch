known_issues:
  - id: "SMOL-001"
    severity: "medium"
    description: "No native state persistence — SmolAgents is designed stateless by default; stateful multi-turn memory requires explicit external storage integration"
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Integrate Redis or PostgreSQL as external memory store; use HuggingFace Hub for model-level state"
    source: "https://github.com/huggingface/smolagents"

  - id: "SMOL-002"
    severity: "low"
    description: "Limited enterprise audit tooling — no native audit log or compliance output; enterprise governance requires custom wrapper"
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Wrap with OpenTelemetry or Helicone for observability; add custom audit middleware"
    source: "https://huggingface.co/docs/smolagents"

