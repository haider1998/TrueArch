  confidence_override: null
  sources:
    - "https://github.com/huggingface/smolagents"
    - "https://huggingface.co/docs/smolagents"
  notes: |
    Verified May 16 2026: 18,500+ GitHub stars, latest release v1.13.0 (April 28 2026).
    SmolAgents is HuggingFace's opinionated, minimal orchestration framework.
    Design philosophy: "CodeAgent" runs Python code directly rather than JSON tool calls —
    significantly different from LangGraph/CrewAI paradigm.
    Best for: teams using HuggingFace Hub models, rapid prototyping, research workflows.
    Not recommended for: enterprise compliance-heavy systems, large stateful multi-agent graphs.
    MCP support: community wrapper available but not native. Watch for native MCP in v2.0+.
