  notes: |
    High star count reflects early viral adoption (role/persona framing resonated).
    However, production reliability issues are well-documented — particularly memory leak (CREW-001)
    and thread safety (CREW-003). Best for prototyping and low-concurrency workflows.
    NOT recommended for HIPAA or high-concurrency production systems without significant mitigation.
    Watch: Company is addressing reliability but cadence of breaking changes is high.
    TrueArch position: "Use with Caution" for production; strong for prototyping.
