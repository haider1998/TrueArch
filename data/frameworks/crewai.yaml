known_issues:
  - id: "CREW-001"
    severity: "high"
    description: "Memory leaks and state contamination in long-running sessions — improperly managed memory causes resource exhaustion. Background threads for non-blocking memory saves must be explicitly drained on shutdown."
    affected_versions: "< 1.14.x"
    resolved: false
    resolved_in: null
    workaround: "Use memory.close()/drain_writes() in finally blocks; prefer external DB (PostgreSQL/SQLite) with unique threadId keys over built-in memory; reset_memories() between sessions"
    source: "https://docs.crewai.com/en/latest/concepts/memory"

  - id: "CREW-002"
    severity: "high"
    description: "Thread safety — orphaned threads from Agent._execute_with_timeout() fail to clean up on timeout, causing resource exhaustion. Internal processes are NOT inherently parallel despite async API."
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Run agents as independent subprocesses using message buses (Redis pub/sub); do not rely on shared-memory threading for high-scale production"
    source: "https://github.com/crewAIInc/crewAI"

  - id: "CREW-003"
    severity: "critical"
    description: "CVEs CVE-2026-2275, CVE-2026-2287, CVE-2026-2286, CVE-2026-2285 — RCE and SSRF vulnerabilities in Code Interpreter tool and default config. Allows remote code execution, arbitrary file reads, or SSRF when agents are exposed to untrusted input."
    affected_versions: "< 1.14.5"
    resolved: false
    resolved_in: null
    workaround: "Do NOT enable allow_code_execution=True unless strictly sandboxed; apply rigorous input sanitization; ensure fail-closed config if Docker is unreachable"
    source: "CVE database Q1 2026"

  - id: "CREW-004"
    severity: "medium"
    description: "Observability black box — default logging is insufficient for mission-critical systems. No native distributed tracing; crew execution is opaque without external tooling."
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Integrate LangFuse or AgentOps for observability; use CrewAI Flows for explicit state management and error recovery"
    source: "Community production reports 2026"

