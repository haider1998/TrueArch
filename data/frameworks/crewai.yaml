known_issues:
  - id: "CREW-001"
    severity: "high"
    description: "Memory leak under concurrent crew runs — agent memory grows unbounded without explicit cleanup"
    affected_versions: "< 0.75.0"
    resolved: false
    resolved_in: null
    workaround: "Restart crew instances after N tasks; use external memory store instead of built-in"
    source: "https://github.com/crewAIInc/crewAI/issues/1203"

  - id: "CREW-002"
    severity: "medium"
    description: "Tool call retry logic can cause duplicate actions when LLM returns malformed tool call JSON"
    affected_versions: "0.60.0 - 0.78.0"
    resolved: true
    resolved_in: "0.79.0"
    workaround: null
    source: "https://github.com/crewAIInc/crewAI/issues/1456"

  - id: "CREW-003"
    severity: "medium"
    description: "Thread safety issues when running multiple crews concurrently in the same process"
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Run each crew in a separate process or use async crew orchestration with process isolation"
    source: "https://github.com/crewAIInc/crewAI/issues/987"

