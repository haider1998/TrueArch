  notes: |
    IMPORTANT: LangChain represents a category in transition.
    Enormous installed base (93K stars, 820 job postings) but momentum is shifting to LangGraph.
    Commit velocity declining; LangChain Inc engineering focus is clearly LangGraph.
    Star growth nearly flat (0.3%/month vs LangGraph's 4.2%/month).
    High breaking change rate and ecosystem fragmentation are real pain points.
    
    TrueArch position: Do NOT recommend for new projects in 2026. Recommend LangGraph instead.
    For existing LangChain codebases: provide Migration Intelligence to LangGraph.
    This is TrueArch's clearest "Installed Base Audit" opportunity — the LangChain installed base
    is large, knows they need to migrate, and needs help doing it.
    
    Framework Mortality Signal: DECLINING. Monitor quarterly for acceleration.
