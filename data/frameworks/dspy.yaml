  next_validation_due: "2026-06-16"
  confidence_override: null
  sources:
    - "https://github.com/stanfordnlp/dspy"
    - "https://dspy.ai"
    - "https://dspy.ai/docs"
  notes: |
    Verified May 16 2026: 24,000+ GitHub stars, latest release v2.6.0 (April 15 2026).
    DSPy (Declarative Self-improving Python) is Stanford NLP's framework for programming
    language models rather than prompting them. Unique value: automatic optimization of
    prompts and few-shot examples via compiled signatures (BootstrapFewShot, MIPRO, etc.)
    Best for: RAG pipelines with complex retrieval, production LLM systems requiring
    automatic prompt optimization, research-to-production use cases.
    Not recommended for: real-time agentic workflows requiring async, enterprise systems
    requiring audit trails, or multi-agent orchestration without async support.
    MCP status: no support. Not expected short-term given academic focus.
