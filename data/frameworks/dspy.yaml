known_issues:
  - id: "DSPY-001"
    severity: "high"
    description: "Not async-native — DSPy has limited async support, which creates bottlenecks in high-throughput agentic pipelines that rely on concurrent LLM calls"
    affected_versions: "< 2.6.0"
    resolved: false
    resolved_in: null
    workaround: "Use thread pools or asyncio.to_thread() wrappers; consider LangGraph for async-native orchestration"
    source: "https://github.com/stanfordnlp/dspy"

  - id: "DSPY-002"
    severity: "medium"
    description: "API instability — DSPy is transitioning from research to production; significant API changes between major versions, particularly in optimizers and module composition"
    affected_versions: "< 2.0.0"
    resolved: true
    resolved_in: "2.0.0"
    workaround: "Pin to 2.x series; review migration guide for 1.x → 2.x"
    source: "https://dspy.ai/docs/migration"

  - id: "DSPY-003"
    severity: "low"
    description: "No native MCP support — DSPy tools are not MCP-compatible out of the box; agent interoperability requires manual adaptation"
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Wrap DSPy modules as MCP tools manually using mcp-sdk; watch for community MCP adapter"
    source: "https://github.com/stanfordnlp/dspy"

compatible_with:
  - framework: "fastapi"
    strength: 0.75
    notes: "DSPy programs exposed as FastAPI endpoints; requires sync-to-async bridge"

  - framework: "opentelemetry"
    strength: 0.65
    notes: "Via custom instrumentation; no native OTEL support"

  - framework: "qdrant"
    strength: 0.80
    notes: "DSPy retrieval modules integrate well with Qdrant for RAG pipelines"

conflicts_with:
  - framework: "langgraph"
    severity: "low"
    notes: "Different paradigms: DSPy is declarative/optimizer-focused, LangGraph is graph-based orchestration. Can be combined but complex to maintain."

