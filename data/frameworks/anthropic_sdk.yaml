known_issues:
  - id: "ANT-001"
    severity: "high"
    category: "context_window"
    frequency: "common"
    production_impact: "high"
    description: "Claude models have a 200K context window but input costs scale linearly. Sending large contexts frequently leads to unexpected cost spikes."
    affected_versions: ">=0.20.0"
    resolved: false
    workaround: "Use context caching (prompt caching) for repeated prefixes. Monitor token usage with usage.input_tokens in responses."
    source: "https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching"
    first_reported: "2024-06-01"

  - id: "ANT-002"
    severity: "medium"
    category: "api_change"
    frequency: "uncommon"
    production_impact: "medium"
    description: "The messages API replaced the older text_completions API. Code using the legacy completion style will fail."
    affected_versions: "<0.18.0"
    resolved: true
    resolved_in: "0.18.0"
    workaround: "Use client.messages.create() with the messages list format."
    source: "https://docs.anthropic.com/en/api/messages"
    first_reported: "2023-09-01"

  - id: "ANT-003"
    severity: "medium"
    category: "tooling"
    frequency: "common"
    production_impact: "medium"
    description: "Tool use (function calling) requires strict JSON schema for tool definitions. Malformed schemas fail silently or cause unexpected model behavior."
    affected_versions: ">=0.20.0"
    resolved: false
    workaround: "Validate tool schemas with jsonschema before sending. Use Pydantic models to generate schemas automatically."
    source: "https://docs.anthropic.com/en/docs/tool-use"
    first_reported: "2024-04-01"

# Deprecated API patterns for the validate_code tool (daily-loop hallucination killer)
deprecated_patterns:
  - id: "ANT-001"
    severity: "critical"
    bad_pattern: '\bclient\.completions\.create\s*\('
    bad_example: |
      client.completions.create(model='claude-2', prompt='Human: hi\n\nAssistant:')
    correct_example: |
      client.messages.create(
          model='claude-sonnet-5',
          max_tokens=1024,
          messages=[{'role': 'user', 'content': 'hi'}],
      )
    version_deprecated: "0.20.0"
    version_correct: ">=0.20.0"
    description: >
      The legacy text-completions API (client.completions.create with the
      Human:/Assistant: prompt format) is deprecated. Use the Messages API
      (client.messages.create) with a structured messages list.
    docs_url: "https://docs.anthropic.com/en/api/messages"

  - id: "ANT-002"
    severity: "high"
    bad_pattern: 'from\s+anthropic\s+import\s+.*\bHUMAN_PROMPT\b'
    bad_example: "from anthropic import HUMAN_PROMPT, AI_PROMPT"
    correct_example: |
      from anthropic import Anthropic
      client = Anthropic()
      # Roles are structured now — no HUMAN_PROMPT/AI_PROMPT sentinels.
    version_deprecated: "0.20.0"
    version_correct: ">=0.20.0"
    description: >
      HUMAN_PROMPT / AI_PROMPT belong to the old completions prompt format and
      are not used by the Messages API. Use structured message roles instead.
    docs_url: "https://docs.anthropic.com/en/api/messages"

  - id: "ANT-003"
    severity: "medium"
    bad_pattern: '\bclient\.count_tokens\s*\('
    bad_example: "n = client.count_tokens('some text')"
    correct_example: |
      # Use the dedicated token-counting endpoint:
      client.messages.count_tokens(
          model='claude-sonnet-5',
          messages=[{'role': 'user', 'content': 'some text'}],
      )
    version_deprecated: "0.39.0"
    version_correct: ">=0.39.0"
    description: >
      The top-level client.count_tokens() helper was removed. Use
      client.messages.count_tokens() with the model and messages.
    docs_url: "https://docs.anthropic.com/en/docs/build-with-claude/token-counting"

