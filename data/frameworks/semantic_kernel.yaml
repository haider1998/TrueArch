known_issues:
  - id: "SK-001"
    severity: "high"
    category: "api_stability"
    frequency: "common"
    production_impact: "high"
    description: "Semantic Kernel has had significant API changes between minor versions (0.x→1.x). Plugin, Function, and Kernel APIs changed multiple times."
    affected_versions: "<1.0.0"
    resolved: true
    resolved_in: "1.0.0"
    workaround: "Pin to v1.x. The v1.0 API is declared stable. Review migration guide for 0.x→1.x."
    source: "https://github.com/microsoft/semantic-kernel/releases"
    first_reported: "2023-09-01"

  - id: "SK-002"
    severity: "high"
    category: "azure_dependency"
    frequency: "common"
    production_impact: "medium"
    description: "Semantic Kernel is optimized for Azure OpenAI and Azure services. Using non-Azure providers requires extra configuration and some features may not be available."
    affected_versions: ">=1.0.0"
    resolved: false
    workaround: "SK supports OpenAI directly and has growing community integrations for Anthropic, Gemini. Use the explicit connector classes."
    source: "curated"
    first_reported: "2024-01-01"

  - id: "SK-003"
    severity: "medium"
    category: "complexity"
    frequency: "common"
    production_impact: "medium"
    description: "Semantic Kernel has higher cognitive overhead than LangGraph or CrewAI. Kernel, Plugin, Function, and Filter abstractions require significant upfront learning."
    affected_versions: ">=1.0.0"
    resolved: false
    workaround: "Start with the SK Getting Started notebooks. The Kernel class is the core concept; everything else builds on it."
    source: "curated"
    first_reported: "2024-03-01"

