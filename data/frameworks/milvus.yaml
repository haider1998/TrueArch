known_issues:
  - id: "MIL-001"
    severity: "high"
    category: "deployment_complexity"
    frequency: "very_common"
    production_impact: "high"
    description: "Milvus distributed mode requires Kubernetes + etcd + MinIO/S3 + Pulsar/Kafka. Deployment complexity is significantly higher than Qdrant or Pinecone."
    affected_versions: ">=2.0.0"
    resolved: false
    workaround: "Use Milvus Lite (single-binary) for dev/test. Use Zilliz Cloud (managed Milvus) for production to avoid ops overhead."
    source: "curated"
    first_reported: "2022-11-01"

  - id: "MIL-002"
    severity: "high"
    category: "resource_usage"
    frequency: "common"
    production_impact: "high"
    description: "Milvus distributed mode requires significant memory for index loading. HNSW indexes for 100M+ vectors require 50GB+ RAM per node."
    affected_versions: ">=2.0.0"
    resolved: false
    workaround: "Use DiskANN or IVF_SQ8 indexes for memory efficiency. Enable mmap for large-scale index storage."
    source: "https://milvus.io/docs/index.md"
    first_reported: "2023-05-01"

  - id: "MIL-003"
    severity: "medium"
    category: "api_change"
    frequency: "common"
    production_impact: "medium"
    description: "Milvus 2.x Python client (pymilvus) had significant API changes from 1.x. The Collection-based API replaced the legacy API."
    affected_versions: "<2.0.0"
    resolved: true
    resolved_in: "2.0.0"
    workaround: "Use pymilvus>=2.4.0. Use MilvusClient (new unified API) instead of the legacy Connections+Collection pattern."
    source: "https://milvus.io/docs/migrate_overview.md"
    first_reported: "2022-06-01"

