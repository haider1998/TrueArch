  - framework: "langchain"
    strength: 0.90
    notes: "Official LangChain Qdrant integration"

  - framework: "fastapi"
    strength: 0.95
    notes: "Direct REST or gRPC to Qdrant from FastAPI; standard pattern"

  - framework: "opentelemetry"
    strength: 0.75
    notes: "OTEL instrumentation available via community library"

conflicts_with: []

supersedes: []

migrates_to:
