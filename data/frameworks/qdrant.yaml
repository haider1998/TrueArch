    effort: 0.3
    notes: "Similar API surface; mostly client library swap"
  - framework: "postgresql_pgvector"
    effort: 0.5
    notes: "Schema changes required; SQL query model differs significantly"

curation:
  status: "curated"
  last_validated: "2026-05-16"
  validated_by: "founder"
  next_validation_due: "2026-06-16"
  confidence_override: null
  sources:
    - "https://github.com/qdrant/qdrant"
    - "https://qdrant.tech/documentation/"
    - "https://discord.com/invite/qdrant"
  notes: |
    TrueArch primary recommendation for open-source vector DB in 2026.
    Built in Rust = excellent performance and stability characteristics.
    Zero breaking changes in last 90 days is exceptional for this ecosystem.
    Strong EU GDPR story (company is EU-based, EU data residency options).
    Qdrant Cloud available for managed deployment.
    Main competitor: Pinecone (managed), pgvector (SQL-native).
    Recommend Qdrant for: pure vector workloads, self-hosted requirements, GDPR-heavy use cases.
    Recommend pgvector instead when: already on PostgreSQL, need SQL queries alongside vectors.
