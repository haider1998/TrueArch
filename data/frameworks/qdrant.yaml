known_issues:
  - id: "QDR-001"
    severity: "low"
    description: "Shard rebalancing can cause temporary read latency spikes (50-200ms) on large collections during node scaling events"
    affected_versions: "< 1.10.0"
    resolved: true
    resolved_in: "1.10.0"
    workaround: null
    source: "https://github.com/qdrant/qdrant/issues/3241"

  - id: "QDR-002"
    severity: "low"
    description: "gRPC streaming can drop connections under very high throughput (>5K RPS) without keep-alive configuration"
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Set grpc.keepalive_time_ms=30000 in client config"
    source: "https://github.com/qdrant/qdrant/issues/2987"

compatible_with:
