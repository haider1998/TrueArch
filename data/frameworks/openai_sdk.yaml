known_issues:
  - id: "OAI-001"
    severity: "critical"
    category: "api_change"
    frequency: "very_common"
    production_impact: "critical"
    description: "openai.ChatCompletion.create() and openai.Completion.create() were REMOVED in v1.0.0. Code using v0.x module-level API will fail at import or runtime."
    affected_versions: "<1.0.0"
    resolved: true
    resolved_in: "1.0.0"
    workaround: "Replace with: from openai import OpenAI; client = OpenAI(); client.chat.completions.create(...)"
    source: "https://github.com/openai/openai-python/discussions/742"
    first_reported: "2023-11-06"

  - id: "OAI-002"
    severity: "high"
    category: "rate_limiting"
    frequency: "common"
    production_impact: "high"
    description: "Rate limit errors (429) are common at scale without exponential backoff. Default SDK does not retry on 429."
    affected_versions: ">=1.0.0"
    resolved: false
    workaround: "Use the built-in retry: client = OpenAI(max_retries=5). For aggressive retry, use tenacity."
    source: "https://platform.openai.com/docs/guides/rate-limits"
    first_reported: "2024-01-15"

  - id: "OAI-003"
    severity: "high"
    category: "cost"
    frequency: "common"
    production_impact: "high"
    description: "Streaming responses are not counted in the response.usage token count by default in older SDK versions. Cost tracking may be inaccurate for streaming."
    affected_versions: "<1.26.0"
    resolved: true
    resolved_in: "1.26.0"
    workaround: "Upgrade to v1.26+. Use stream_options={\"include_usage\": true} to get usage in streaming."
    source: "https://platform.openai.com/docs/api-reference/chat/streaming"
    first_reported: "2024-03-10"

  - id: "OAI-004"
    severity: "medium"
    category: "vendor_lock_in"
    frequency: "common"
    production_impact: "medium"
    description: "Direct OpenAI API dependency creates vendor lock-in. Provider outages (even brief) directly affect production availability."
    affected_versions: ">=1.0.0"
    resolved: false
    workaround: "Use LiteLLM or an abstraction layer for multi-provider failover. Azure OpenAI provides SLA guarantees."
    source: "curated"
    first_reported: "2024-01-01"

# ─────────────────────────────────────────────
# COMPATIBILITY
# ─────────────────────────────────────────────
# Deprecated API patterns for the validate_code tool (daily-loop hallucination killer)
deprecated_patterns:
  - id: "OAI-V-001"
    severity: "critical"
    bad_pattern: '\bopenai\.ChatCompletion\.create\s*\('
    bad_example: "response = openai.ChatCompletion.create(model='gpt-4', messages=[...])"
    correct_example: |
      from openai import OpenAI
      client = OpenAI(api_key='xxx')
      response = client.chat.completions.create(model='gpt-4o', messages=[...])
    version_deprecated: "1.0.0"
    version_correct: ">=1.0.0"
    description: >
      openai.ChatCompletion.create() (v0.x module-level API) was removed in v1.0.0.
      The v1.x SDK uses a client instance: `from openai import OpenAI; client = OpenAI()`.
    docs_url: "https://github.com/openai/openai-python/discussions/742"

  - id: "OAI-V-002"
    severity: "critical"
    bad_pattern: '\bopenai\.Completion\.create\s*\('
    bad_example: "response = openai.Completion.create(engine='text-davinci-003', prompt='...')"
    correct_example: |
      from openai import OpenAI
      client = OpenAI()
      response = client.chat.completions.create(
          model='gpt-4o',
          messages=[{'role': 'user', 'content': '...'}]
      )
    version_deprecated: "1.0.0"
    version_correct: ">=1.0.0"
    description: >
      openai.Completion (text completion) is removed in v1.0 and the underlying
      models are deprecated by OpenAI. Use chat completions with gpt-4o instead.
    docs_url: "https://platform.openai.com/docs/guides/text-generation"

  - id: "OAI-V-003"
    severity: "high"
    bad_pattern: '\bopenai\.api_key\s*='
    bad_example: "openai.api_key = 'sk-...'  # module-level key setting"
    correct_example: "client = OpenAI(api_key='sk-...')  # or use OPENAI_API_KEY env var"
    version_deprecated: "1.0.0"
    version_correct: ">=1.0.0"
    description: >
      Setting openai.api_key globally is the v0.x pattern. In v1.x, pass api_key to
      the client constructor or set the OPENAI_API_KEY env var.
    docs_url: "https://github.com/openai/openai-python/discussions/742"

