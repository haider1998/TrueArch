# ─────────────────────────────────────────────
# KNOWN ISSUES
# ─────────────────────────────────────────────
known_issues:
  - id: "LGR-001"
    severity: "medium"
    description: "StateGraph checkpoint format changed in v0.2.0 — incompatible with 0.1.x state schemas"
    affected_versions: "< 0.2.0"
    resolved: true
    resolved_in: "0.2.0"
    workaround: null
    source: "https://github.com/langchain-ai/langgraph/releases/tag/0.2.0"

  - id: "LGR-002"
    severity: "medium"
    description: "Memory growth under high concurrent state updates (> 500 concurrent graphs with in-memory checkpointing)"
    affected_versions: "< 0.2.28"
    resolved: false
    resolved_in: null
    workaround: "Use Redis external checkpointer instead of MemorySaver for production deployments"
    source: "https://github.com/langchain-ai/langgraph/issues/1847"

  - id: "LGR-003"
    severity: "low"
    description: "Streaming token output can cause state inconsistency if interrupt_before is used during streaming"
    affected_versions: "0.2.0 - 0.2.20"
    resolved: true
    resolved_in: "0.2.21"
    workaround: null
    source: "https://github.com/langchain-ai/langgraph/issues/2013"

# ─────────────────────────────────────────────
# COMPATIBILITY
# ─────────────────────────────────────────────
compatible_with:
  - framework: "redis"
    strength: 0.95
    notes: "Primary recommended checkpointer/memory backend for production LangGraph deployments"

  - framework: "postgresql"
    strength: 0.85
    notes: "AsyncPostgresSaver available; good for compliance-heavy environments needing SQL audit trails"

  - framework: "opentelemetry"
    strength: 0.80
    notes: "Via LangSmith integration or direct OTEL spans on graph nodes"

  - framework: "langsmith"
    strength: 0.92
    notes: "Native LangSmith tracing via LANGCHAIN_TRACING_V2 env var — first-class support"

  - framework: "fastapi"
    strength: 0.90
    notes: "Standard pattern: FastAPI + LangGraph graph exposed as async endpoint"

conflicts_with:
  - framework: "langchain-legacy"
    severity: "low"
    notes: "LangGraph replaces LCEL chains for complex multi-step workflows; both can coexist but mixing is discouraged"

supersedes:
  - framework: "langchain"
    confidence: 0.75
    notes: "For stateful multi-step agent workflows and complex orchestration; LangChain still used for simple chains"

migrates_to:
  - framework: "google_adk"
    effort: 0.6
    notes: "Significant API differences; state management model differs; migration non-trivial"

  - framework: "crewai"
    effort: 0.5
    notes: "Different paradigm (role-based vs graph-based); requires rethinking architecture"

