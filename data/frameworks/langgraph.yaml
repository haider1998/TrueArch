# ─────────────────────────────────────────────
# KNOWN ISSUES
# ─────────────────────────────────────────────
known_issues:
  - id: "LGR-001"
    severity: "medium"
    description: "Checkpoint serialization bloat — serialized state can grow significantly larger than expected in long-running threads, causing storage and token overhead issues in high-throughput environments"
    affected_versions: "< 1.2.0"
    resolved: false
    resolved_in: null
    workaround: "Use DeltaChannel (beta, v1.2.0+) to reduce checkpoint overhead; implement state pruning for long conversations"
    source: "https://github.com/langchain-ai/langgraph"

  - id: "LGR-002"
    severity: "high"
    description: "Agent infinite looping — agents can loop indefinitely despite stop conditions, eventually hitting recursion limits. Prompt-based stop conditions are unreliable."
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Implement explicit step budget limits, time budgets, and NEEDS_HUMAN escalation nodes in graph config. Do NOT rely on prompt-only stop conditions in production."
    source: "https://github.com/langchain-ai/langgraph"

  - id: "LGR-003"
    severity: "medium"
    description: "LangGraph Platform deployment failures — sudden failures when creating new revisions with previously working code, often linked to dependency management or breaking changes in graph configuration"
    affected_versions: "Platform deployments"
    resolved: false
    resolved_in: null
    workaround: "Pin all dependency versions; use explicit requirements.txt lockfiles; test revision upgrades in staging first"
    source: "https://github.com/langchain-ai/langgraph"

  - id: "LGR-004"
    severity: "medium"
    description: "Security: tool exploitation risk — attackers can infer tool names to force unauthorized execution via prompt injection through third-party integrations"
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Validate all tool invocations against explicit allowlists; scope API tokens with least privilege; treat all agent inputs as adversarial"
    source: "LangGraph security best practices documentation"

# ─────────────────────────────────────────────
# COMPATIBILITY
# ─────────────────────────────────────────────
compatible_with:
  - framework: "redis"
    strength: 0.95
    notes: "Primary recommended checkpointer/memory backend for production LangGraph deployments"

  - framework: "postgresql"
    strength: 0.85
    notes: "AsyncPostgresSaver available; good for compliance-heavy environments needing SQL audit trails"

  - framework: "opentelemetry"
    strength: 0.80
    notes: "Via LangSmith integration or direct OTEL spans on graph nodes"

  - framework: "langsmith"
    strength: 0.92
    notes: "Native LangSmith tracing via LANGCHAIN_TRACING_V2 env var — first-class support"

  - framework: "fastapi"
    strength: 0.90
    notes: "Standard pattern: FastAPI + LangGraph graph exposed as async endpoint"

conflicts_with:
  - framework: "langchain-legacy"
    severity: "low"
    notes: "LangGraph replaces LCEL chains for complex multi-step workflows; both can coexist but mixing is discouraged"

supersedes:
  - framework: "langchain"
    confidence: 0.75
    notes: "For stateful multi-step agent workflows and complex orchestration; LangChain still used for simple chains"

migrates_to:
  - framework: "google_adk"
    effort: 0.6
    notes: "Significant API differences; state management model differs; migration non-trivial"

  - framework: "crewai"
    effort: 0.5
    notes: "Different paradigm (role-based vs graph-based); requires rethinking architecture"

