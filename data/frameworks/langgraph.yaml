  sources:
    - "https://github.com/langchain-ai/langgraph"
    - "https://langchain.com/langgraph"
    - "https://github.com/langchain-ai/langgraph/releases"
  notes: |
    Verified May 16 2026: 32,000+ GitHub stars, latest release v1.2.0 (May 11 2026).
    v1.2.0 introduced: finer-grained node execution control (timeouts, error recovery,
    graceful shutdown), DeltaChannel (beta) for reduced checkpoint overhead, and a new
    content-block-centric streaming API v3.
    Primary recommended orchestration framework for stateful multi-agent Python systems.
    Main production concerns: infinite looping (always implement step budgets), checkpoint
    bloat (use DeltaChannel in v1.2+), and security boundaries (treat all inputs as adversarial).
    MCP support: community plugins available, not yet native. Watch for native MCP in v1.3+.
