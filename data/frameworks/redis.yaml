known_issues:
  - id: "REDIS-001"
    severity: "medium"
    description: "Memory growth under high-frequency key creation without TTL — OOM risk in long-running agent systems"
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Always set TTL on agent session keys; implement Redis maxmemory policy (allkeys-lru)"
    source: "https://redis.io/docs/manual/eviction/"

  - id: "REDIS-002"
    severity: "high"
    description: "LICENSE CHANGE: Redis changed from BSD to RSALv2+SSPL in 2024 — impacts cloud provider redistribution. Valkey is the community OSS fork."
    affected_versions: ">= 7.4.0"
    resolved: false
    resolved_in: null
    workaround: "Use Valkey for pure OSS requirement; use Redis Cloud/AWS ElastiCache for managed; use Redis 7.2.x LTS for BSD license"
    source: "https://redis.io/blog/redis-adopts-dual-source-available-licensing/"

  - id: "REDIS-003"
    severity: "low"
    description: "Single-threaded command execution means CPU-intensive Lua scripts can block other operations"
    affected_versions: "< 7.0"
    resolved: true
    resolved_in: "7.0"             # Redis 7.0 added threading for I/O
    workaround: null
    source: "https://redis.io/docs/management/scaling/"

compatible_with:
  - framework: "langgraph"
    strength: 0.95
    notes: "Primary recommended checkpointer for LangGraph production deployments (AsyncRedisSaver)"

  - framework: "crewai"
    strength: 0.70
    notes: "Community memory integration; helps with CrewAI-001 memory leak when used as external store"

  - framework: "fastapi"
    strength: 0.90
    notes: "Standard caching and session layer; aioredis for async FastAPI patterns"

  - framework: "opentelemetry"
    strength: 0.70
    notes: "Redis spans available via opentelemetry-instrumentation-redis"

conflicts_with: []

supersedes: []

migrates_to:
  - framework: "valkey"
    effort: 0.1
    notes: "Valkey is a drop-in Redis OSS fork; API-compatible; minimal migration effort"
  - framework: "postgresql"
    effort: 0.7
    notes: "Fundamentally different data model; significant effort for complex Redis patterns"

curation:
  status: "curated"
  last_validated: "2026-05-16"
  validated_by: "founder"
  next_validation_due: "2026-06-16"
  confidence_override: null
  sources:
    - "https://github.com/redis/redis"
    - "https://redis.io/docs/"
    - "https://redis.io/blog/redis-adopts-dual-source-available-licensing/"
  notes: |
    Battle-tested, extremely mature (10+ years production use). Lowest production incident
    rate of any framework in our database. Effectively the default choice for session memory
    and agent state caching.
    
    IMPORTANT LICENSE NOTE (REDIS-002): The 2024 license change (BSD → RSALv2+SSPL) is the
    most significant development in the Redis ecosystem. For open-source projects or cloud
    provider workloads, evaluate Valkey (OSS fork). For internal/enterprise use, RSALv2 is
    fine. TrueArch must flag this in every Redis recommendation.
    
    TrueArch position: Recommend Redis for production agent memory in most cases.
    Always flag the license consideration. Suggest Valkey as the OSS alternative.
    Note REDIS-001 (TTL discipline) in every recommendation — it's a common mistake.
