known_issues:
  - id: "REDIS-001"
    severity: "medium"
    description: "Memory growth under high-frequency key creation without TTL — OOM risk in long-running agent systems"
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Always set TTL on agent session keys; implement Redis maxmemory policy (allkeys-lru)"
    source: "https://redis.io/docs/manual/eviction/"

  - id: "REDIS-002"
    severity: "medium"
    description: "LICENSE HISTORY: Redis changed from BSD to RSALv2+SSPL in March 2024 (v7.4+), then introduced AGPLv3 (OSI-approved) in Redis 8.0+ (May 2025). Valkey (Linux Foundation, BSD 3-Clause) was forked by AWS/Google/Oracle as the community OSS alternative and is a drop-in replacement for Redis 7.2."
    affected_versions: "7.4.0 - 7.x (RSALv2+SSPL); 8.0+ (AGPLv3)"
    resolved: false
    resolved_in: null
    workaround: "Use Redis 8.x (AGPLv3) for OSI-compliant open source; use Valkey for BSD-licensed drop-in alternative; use Redis Cloud/AWS ElastiCache for managed enterprise use"
    source: "https://redis.io/blog/redis-adopts-dual-source-available-licensing/"

  - id: "REDIS-003"
    severity: "low"
    description: "Single-threaded command execution means CPU-intensive Lua scripts can block other operations"
    affected_versions: "< 7.0"
    resolved: true
    resolved_in: "7.0"             # Redis 7.0 added threading for I/O
    workaround: null
    source: "https://redis.io/docs/management/scaling/"

