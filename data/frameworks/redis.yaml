curation:
  status: "curated"
  last_validated: "2026-05-16"
  validated_by: "founder"
  next_validation_due: "2026-06-16"
  confidence_override: null
  sources:
    - "https://github.com/redis/redis"
    - "https://redis.io/docs/"
    - "https://redis.io/blog/redis-adopts-dual-source-available-licensing/"
    - "https://valkey.io"
    - "https://linuxfoundation.org/projects/valkey"
  notes: |
    Verified May 16 2026: 74,400 GitHub stars. Latest in 8.x line: 8.6.3 (May 2026).
    
    LICENSE SITUATION (important for every recommendation):
    - Redis 7.2.x and earlier: BSD 3-Clause
    - Redis 7.4.x - 7.x: RSALv2 + SSPL (NOT OSI-approved)
    - Redis 8.0+ (May 2025+): AGPLv3 added as option (OSI-approved)
    - Valkey: BSD 3-Clause fork by Linux Foundation; backed by AWS, Google, Oracle; 
      drop-in compatible with Redis 7.2; own roadmap with multi-threaded I/O improvements
    
    For most production AI systems: Redis 8.x (AGPLv3) is fine.
    For strict BSD/Apache-only policy: use Valkey.
    For managed cloud: AWS ElastiCache, GCP Memorystore both support Redis/Valkey.
    
    TrueArch must surface license context in every Redis recommendation.
    Default: Recommend Redis 8.x for production agent memory. Note Valkey as OSS alternative.
