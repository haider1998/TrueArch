  confidence_override: null
  sources:
    - "https://github.com/fastapi/fastapi"
    - "https://pypi.org/project/fastapi/"
    - "https://fastapi.tiangolo.com"
  notes: |
    Verified May 16 2026: 98,300 GitHub stars. Latest: v0.136.1 (April 23 2026).
    
    FastAPI is the de-facto Python API framework for AI systems in 2026.
    2,100 job postings/month — highest REST API demand in the AI ecosystem.
    
    In TrueArch context: FastAPI is the API layer (D6=REST) for serving agent capabilities.
    It wraps LangGraph/CrewAI/Pydantic AI agents as HTTP endpoints.
    
    TrueArch position: DEFAULT recommendation for the REST API layer in any Python AI system.
    No caveats for typical use. Flag FAPI-002 (background task retry) for async-heavy workflows.
    Every recommendation with D5=PY and D6=REST should include FastAPI unless there's a specific reason not to.
