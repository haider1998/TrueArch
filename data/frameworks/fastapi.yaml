known_issues:
  - id: "FAPI-001"
    severity: "low"
    description: "Startup time increases with large numbers of routes (1000+ endpoints). Not typical for AI agent APIs but relevant for large monolithic deployments."
    affected_versions: "< 0.100.0"
    resolved: true
    resolved_in: "0.100.0"
    workaround: null
    source: "https://github.com/fastapi/fastapi/issues/3011"

  - id: "FAPI-002"
    severity: "low"
    description: "Background tasks do not have built-in retry logic — failed background tasks are silently dropped unless explicitly handled."
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Use Celery, ARQ, or Redis Queue for reliable background task execution in production"
    source: "https://fastapi.tiangolo.com/tutorial/background-tasks/"

compatible_with:
  - framework: "langgraph"
    strength: 0.90
    notes: "Standard pattern: LangGraph agent graph exposed via FastAPI async endpoint"

  - framework: "pydantic_ai"
    strength: 0.95
    notes: "Near-zero friction — both Pydantic-based; shared validation, serialization, type system"

  - framework: "llamaindex"
    strength: 0.85
    notes: "LlamaIndex query engine behind FastAPI endpoint is a primary production pattern"

  - framework: "redis"
    strength: 0.90
    notes: "Redis as session cache and rate limiting layer for FastAPI; standard pattern"

  - framework: "opentelemetry"
    strength: 0.95
    notes: "opentelemetry-instrumentation-fastapi is production-grade and widely used"

  - framework: "qdrant"
    strength: 0.85
    notes: "Qdrant client from FastAPI endpoint; standard vector search API pattern"

conflicts_with: []

supersedes:
