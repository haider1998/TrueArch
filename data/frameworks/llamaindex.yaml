  next_validation_due: "2026-06-16"
  confidence_override: null
  sources:
    - "https://github.com/run-llama/llama_index"
    - "https://pypi.org/project/llama-index/"
    - "https://docs.llamaindex.ai"
  notes: |
    Verified May 16 2026: 49,400 GitHub stars. Latest: v0.14.22 (May 14 2026).
    
    KEY DIFFERENTIATOR: Best-in-class for DATA-CENTRIC RAG architectures. LlamaIndex is
    specifically designed around data ingestion, indexing, and retrieval — the RAG use case.
    If D1=RAG in the Genome, LlamaIndex vs LangChain is the primary comparison.
    
    Primary strengths:
    - Purpose-built for RAG (vs LangChain which covers everything)
    - Excellent connector ecosystem (200+ data source integrations)
    - Strong document processing pipeline
    - Active development; v0.14.x stable API
    
    TrueArch position: PRIMARY RECOMMENDATION when D1=RAG in Genome.
    Recommend alongside a vector DB (Qdrant preferred for self-hosted; Pinecone for managed).
    Not the right choice for complex agentic workflows — use LangGraph for those.
