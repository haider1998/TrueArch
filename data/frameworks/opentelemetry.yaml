known_issues:
  - id: "OTEL-001"
    severity: "medium"
    description: "Python SDK auto-instrumentation can cause 5-15% CPU overhead in high-throughput applications"
    affected_versions: "< 1.20.0"
    resolved: true
    resolved_in: "1.20.0"
    workaround: "Use manual instrumentation for hot paths; enable sampling to reduce overhead"
    source: "https://github.com/open-telemetry/opentelemetry-python/issues/3142"

  - id: "OTEL-002"
    severity: "low"
    description: "LLM-specific semantic conventions (gen_ai.*) are in experimental status — may change"
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Use gen_ai.* attributes but be prepared for schema changes in minor versions"
    source: "https://opentelemetry.io/docs/specs/semconv/gen-ai/"

compatible_with:
  - framework: "langgraph"
    strength: 0.80
    notes: "Via LangSmith or direct span instrumentation on graph nodes"

  - framework: "fastapi"
    strength: 0.95
    notes: "opentelemetry-instrumentation-fastapi is production-grade"

  - framework: "redis"
    strength: 0.70
    notes: "opentelemetry-instrumentation-redis available; good for tracing cache operations"

  - framework: "qdrant"
    strength: 0.75
    notes: "Community OTEL instrumentation; traces Qdrant client calls"

conflicts_with: []

supersedes:
  - framework: "langsmith"
    confidence: 0.40
    notes: "OTEL is more general; LangSmith is LLM-specific. For LLM tracing specifically, LangSmith may be preferable."

migrates_to: []

curation:
  status: "curated"
  last_validated: "2026-05-16"
  validated_by: "founder"
  next_validation_due: "2026-06-16"
  confidence_override: null
  sources:
    - "https://github.com/open-telemetry/opentelemetry-python"
    - "https://opentelemetry.io/docs/"
    - "https://opentelemetry.io/docs/specs/semconv/gen-ai/"
  notes: |
    CNCF-graduated project — the most strategically safe observability choice.
    Vendor-neutral: exports to Jaeger, Zipkin, Prometheus, Datadog, Grafana, etc.
    
    For AI/LLM observability: use the gen_ai.* semantic conventions (experimental but
    de-facto standard). LangSmith is better for LangChain-specific LLM tracing.
    
    TrueArch governance alignment: OTEL is exactly the "audit trail from Day 1" approach
    TrueArch promotes. Every TrueArch recommendation that includes observability should
    default to OTEL as the standard.
    
    TrueArch position: Default recommendation for all production systems.
    Exception: Pure LangChain/LangGraph stacks where LangSmith may be simpler to set up.
    Flag: gen_ai.* convention stability (OTEL-002) in AI system recommendations.
