known_issues:
  - id: "OLL-001"
    severity: "high"
    category: "performance"
    frequency: "very_common"
    production_impact: "high"
    description: "Model inference speed is GPU-bound. Without a dedicated GPU, response latency for 13B+ models can be 10-30 seconds per token on CPU."
    affected_versions: ">=0.1.0"
    resolved: false
    workaround: "Use quantized models (Q4_K_M recommended). For production, use dedicated GPU hardware or cloud GPU instances."
    source: "curated"
    first_reported: "2024-01-01"

  - id: "OLL-002"
    severity: "high"
    category: "production_readiness"
    frequency: "common"
    production_impact: "high"
    description: "Ollama is designed for local development. It lacks native load balancing, auth, rate limiting, or HA. Do not expose directly to the internet."
    affected_versions: ">=0.1.0"
    resolved: false
    workaround: "Use a reverse proxy (nginx) with auth. For production scale, use LiteLLM proxy with Ollama as a backend."
    source: "curated"
    first_reported: "2024-02-01"

  - id: "OLL-003"
    severity: "medium"
    category: "api_compatibility"
    frequency: "common"
    production_impact: "medium"
    description: "Ollama provides an OpenAI-compatible API endpoint but not all OpenAI features are supported (e.g., function calling varies by model)."
    affected_versions: ">=0.1.30"
    resolved: false
    workaround: "Test function calling support per model. Use ollama.chat() native API for guaranteed compatibility."
    source: "https://ollama.com/blog/openai-compatibility"
    first_reported: "2024-04-01"

# Deprecated API patterns for the validate_code tool (daily-loop hallucination killer)
deprecated_patterns:
  - id: "OLL-001"
    severity: "medium"
    bad_pattern: '\bollama\.generate\s*\('
    bad_example: "response = ollama.generate(model='llama3', prompt='Why is the sky blue?')"
    correct_example: |
      response = ollama.chat(
          model='llama3',
          messages=[{'role': 'user', 'content': 'Why is the sky blue?'}],
      )
    version_deprecated: "0.4.0"
    version_correct: ">=0.4.0"
    description: >
      For conversational use prefer ollama.chat() with a messages list over the
      raw generate(prompt=...) completion endpoint, which lacks chat templating.
    docs_url: "https://github.com/ollama/ollama-python"

  - id: "OLL-002"
    severity: "advisory"
    bad_pattern: "'model'\\s*:\\s*'llama2'"
    bad_example: "ollama.chat(model='llama2', messages=[...])  # via {'model': 'llama2'}"
    correct_example: "ollama.chat(model='llama3.2', messages=[...])"
    version_deprecated: "0.3.0"
    version_correct: ">=0.3.0"
    description: >
      llama2 is superseded by llama3.x. It still runs, but prefer a current model
      tag (llama3.1 / llama3.2) for materially better quality.
    docs_url: "https://ollama.com/library/llama3.2"

# Deprecated API patterns for the validate_code tool (daily-loop hallucination killer)
deprecated_patterns:
  - id: "OLL-001"
    severity: "medium"
    bad_pattern: '\bollama\.generate\s*\('
    bad_example: "response = ollama.generate(model='llama3', prompt='hi')"
    correct_example: |
      import ollama
      response = ollama.chat(model='llama3', messages=[{'role': 'user', 'content': 'hi'}])
    version_deprecated: "0.4.0"
    version_correct: ">=0.4.0"
    description: >
      The single-turn generate() endpoint is legacy for chat models. Use
      ollama.chat() with a messages list for conversational models.
    docs_url: "https://github.com/ollama/ollama-python"

  - id: "OLL-002"
    severity: "advisory"
    bad_pattern: "'http://localhost:11434/api/generate'"
    bad_example: "requests.post('http://localhost:11434/api/generate', json={...})"
    correct_example: |
      import ollama
      ollama.chat(model='llama3', messages=[...])
    version_deprecated: "0.1.0"
    version_correct: ">=0.1.0"
    description: >
      Hand-rolling HTTP calls to /api/generate works, but the official ollama client
      handles streaming, errors, and the chat format for you.
    docs_url: "https://github.com/ollama/ollama-python"

