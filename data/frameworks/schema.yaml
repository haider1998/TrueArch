# Framework YAML Schema Specification

# All framework YAML files must conform to this schema.
# Fields marked "required" must always be present.
# Fields marked "computed" are generated by the scoring engine — do not edit manually.
# Fields marked "human-assessed" require quarterly human review.

schema_version: "1.0"

# ─────────────────────────────────────────────
# SECTION 1: Identity (all required)
# ─────────────────────────────────────────────
id: string                    # kebab-case unique identifier, e.g. "langgraph"
name: string                  # Display name, e.g. "LangGraph"
category: string              # orchestration | vector-db | memory | observability |
                              # api | guardrails | deployment | protocol | rag | db
subcategory: string           # optional refinement
url: string                   # Primary GitHub or project URL
docs_url: string              # Documentation URL
license: string               # MIT | Apache-2.0 | BSL | proprietary | etc.
primary_language: string      # Python | TypeScript | Go | Rust | Multi
latest_stable_version: string # Semver string, e.g. "0.2.28"
latest_stable_released: date  # YYYY-MM-DD

# Genome dimension this framework maps to
genome_dimension:
  key: string                 # D1_pattern | D2_memory | D3_scaling | D4_compliance |
                              # D5_language | D6_protocol | D7_store | D8_orchestrator |
                              # D9_observability | D10_deployment
  value: string               # The genome code value, e.g. "LGR"

# ─────────────────────────────────────────────
# SECTION 2: Raw Signals (for score computation)
# ─────────────────────────────────────────────
signals:
  production_stability:
    breaking_changes_per_90d: number       # Count of breaking changes in last 90 days
    issue_resolution_ratio: number         # closed_90d / opened_90d (0.0 to 2.0+)
    open_security_advisories: number       # Count of open CVEs/advisories
    incident_rate: number                  # From lineage: fraction of deployments with incidents
    incident_rate_source: string           # "telemetry" | "curated" | "default"
    signals_date: date                     # When these signals were collected

  ecosystem_momentum:
    github_stars: number
    star_growth_30d_pct: number            # Percentage growth in last 30 days
    commits_last_90d: number
    commits_prev_90d: number               # Previous 90-day window for trend
    merged_prs_per_30d: number
    avg_days_to_merge: number
    job_postings_30d: number               # Jobs mentioning this framework, last 30 days
    so_questions_30d: number               # Stack Overflow questions, last 30 days
    so_questions_prev_30d: number
    signals_date: date

  migration_risk:
    viable_alternatives: number            # Count of viable alternative frameworks
    public_api_methods: number             # Approximate public method count (API surface)
    migration_guide_count: number          # Published migration guides (to or from)
    community_migrations: number           # Recorded migrations in TrueArch lineage
    signals_date: date

  governance_readiness:
    unpatched_cves: number
    avg_days_to_patch: number              # Average days to patch a disclosed CVE
    doc_completeness_rating: number        # 0-100, human-assessed quarterly
    hipaa_deployments: number              # Known production HIPAA deployments
    soc2_deployments: number
    gdpr_deployments: number
    other_compliance_deployments: number
    audit_support: string                  # "native" | "plugin" | "none"
    signals_date: date

  agent_compatibility:
    mcp_support: string                    # "native" | "community_plugin" | "wrapper_available" | "none"
    is_async_native: boolean
    is_thread_safe: boolean
    has_concurrency_benchmarks: boolean
    state_management_rating: number        # 0-100, human-assessed
    multiagent_support: string             # "native" | "possible" | "limited" | "none"
    signals_date: date

# ─────────────────────────────────────────────
# SECTION 3: Computed Scores (engine output — do not edit)
# ─────────────────────────────────────────────
computed_scores:
  production_stability: null
  ecosystem_momentum: null
  migration_risk: null
  governance_readiness: null
  agent_compatibility: null
  overall: null
  confidence: null
  score_band: null             # "Excellent" | "Strong" | "Good" | "Fair" | "Weak" | "Poor"
  last_computed: null
  valid_until: null            # last_computed + 30 days

# ─────────────────────────────────────────────
# SECTION 4: Known Issues
# ─────────────────────────────────────────────
known_issues:
  - id: string                 # Framework-prefixed ID, e.g. "LGR-001"
    severity: string           # "critical" | "high" | "medium" | "low"
    description: string
    affected_versions: string  # e.g. "< 0.2.0" or "0.2.1 - 0.2.5"
    resolved: boolean
    resolved_in: string        # Version where resolved (null if unresolved)
    workaround: string         # Workaround if unresolved (null if none)
    source: string             # URL to issue/PR/blog post

# ─────────────────────────────────────────────
# SECTION 5: Compatibility
# ─────────────────────────────────────────────
compatible_with:
  - framework: string          # framework id, e.g. "redis"
    strength: number           # 0.0 to 1.0 (how well they work together)
    notes: string

conflicts_with:
  - framework: string
    severity: string           # "high" | "medium" | "low"
    notes: string

supersedes:
  - framework: string
    confidence: number         # 0.0 to 1.0 (how reliably it supersedes for common use cases)
    notes: string

migrates_to:
  - framework: string
    effort: number             # 0.0 (trivial) to 1.0 (complete rewrite)
    notes: string

# ─────────────────────────────────────────────
# SECTION 6: Curation Metadata
# ─────────────────────────────────────────────
curation:
  status: string               # "curated" | "pending" | "deprecated"
  last_validated: date         # YYYY-MM-DD
  validated_by: string         # "founder" | "advisor" | "community" | "automated"
  next_validation_due: date    # last_validated + 30 days
  confidence_override: null    # Manual confidence adjustment with reason (use sparingly)
  sources:
    - string                   # URLs used to validate signals
  notes: string                # Curator observations not captured in structured fields
