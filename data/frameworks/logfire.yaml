known_issues:
  - id: "LGF-001"
    severity: "medium"
    category: "maturity"
    frequency: "common"
    production_impact: "medium"
    description: "Logfire is a relatively new product (GA in 2025). Some enterprise features (SSO, audit logs, RBAC) are still maturing compared to established tools like Datadog or Honeycomb."
    affected_versions: ">=1.0.0"
    resolved: false
    workaround: "Evaluate maturity needs against team size. For large enterprises, supplement with OpenTelemetry for portable instrumentation."
    source: "curated"
    first_reported: "2025-06-01"

  - id: "LGF-002"
    severity: "low"
    category: "vendor_lock_in"
    frequency: "uncommon"
    production_impact: "low"
    description: "Logfire SaaS backend is proprietary. Self-hosted export to other backends requires OpenTelemetry exporters."
    affected_versions: ">=0.1.0"
    resolved: false
    workaround: "Logfire is built on OpenTelemetry — use OTEL exporters to send data to alternative backends simultaneously."
    source: "curated"
    first_reported: "2025-01-01"

compatible_with:
  - framework: "fastapi"
    strength: 0.98
    notes: "Logfire has first-class FastAPI auto-instrumentation with one line: logfire.instrument_fastapi(app)."
  - framework: "pydantic_ai"
    strength: 0.95
    notes: "Logfire is made by Pydantic; deepest integration with Pydantic AI agents including prompt tracing."
  - framework: "opentelemetry"
    strength: 0.90
    notes: "Logfire exports to OTEL collector. All Logfire spans are OTEL-compatible."

