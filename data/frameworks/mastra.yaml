known_issues:
  - id: "MST-001"
    severity: "critical"
    category: "maturity"
    frequency: "very_common"
    production_impact: "critical"
    description: "Mastra is pre-1.0 and has breaking API changes in every minor release. NOT recommended for production without pinning versions and extensive testing."
    affected_versions: "<1.0.0"
    resolved: false
    workaround: "Pin exact version (e.g., mastra@0.9.1). Subscribe to release notes. Test every upgrade in staging before production."
    source: "https://github.com/mastra-ai/mastra/releases"
    first_reported: "2025-03-01"

  - id: "MST-002"
    severity: "high"
    category: "production_readiness"
    frequency: "common"
    production_impact: "high"
    description: "Mastra's workflow persistence requires a PostgreSQL database and Upstash Redis. Self-hosting these adds significant operational overhead."
    affected_versions: ">=0.5.0"
    resolved: false
    workaround: "Use Mastra Cloud (managed hosting) for simplest production path. For self-hosted, use managed Postgres (RDS/Neon) and Upstash Redis."
    source: "https://mastra.ai/docs/deployment"
    first_reported: "2025-06-01"

  - id: "MST-003"
    severity: "high"
    category: "ecosystem"
    frequency: "common"
    production_impact: "medium"
    description: "Mastra is TypeScript-only. Python-primary teams cannot use it without a separate TypeScript service layer."
    affected_versions: ">=0.1.0"
    resolved: false
    workaround: "For mixed Python/TypeScript teams, use Mastra for the frontend/agent layer and expose Python services via FastAPI REST APIs."
    source: "curated"
    first_reported: "2025-01-01"

compatible_with:
  - framework: "mcp_sdk_python"
    strength: 0.90
    notes: "Mastra has built-in MCP client — can connect to any MCP server including Python ones."
  - framework: "vercel_ai_sdk"
    strength: 0.85
    notes: "Both are TypeScript-native; Mastra handles orchestration while Vercel AI SDK handles streaming UI."

conflicts_with:
  - framework: "langchain"
    severity: "low"
    notes: "LangChain is Python-first; Mastra is TypeScript-only. Not technically conflicting but not interoperable without an API boundary."

supersedes: []
migrates_to:
  - framework: "vercel_ai_sdk"
    effort: 0.5
    notes: "Vercel AI SDK is simpler but less opinionated about agent architecture."

curation:
  status: "curated"
  last_validated: "2026-05-16"
  validated_by: "truearch-team"
  next_validation_due: "2026-06-16"
  sources:
    - "https://mastra.ai/docs"
    - "https://github.com/mastra-ai/mastra/releases"
  notes: "Mastra is the fastest-growing TypeScript agent framework in 2026. It provides LangGraph-like workflow orchestration, built-in MCP support, memory, and RAG primitives — all in TypeScript. CAUTION: pre-1.0, not production-stable. Best for TypeScript-native teams building AI products who want an opinionated full-stack solution. Watch it closely — likely to hit 1.0 stability in H2 2026."
