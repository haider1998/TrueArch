known_issues:
  - id: "VAI-001"
    severity: "high"
    category: "api_change"
    frequency: "common"
    production_impact: "high"
    description: "Vercel AI SDK v3→v4 had breaking changes in streaming APIs. useChat, useCompletion hooks changed significantly. AI SDK Core (generateText, streamText) replaced old patterns."
    affected_versions: "<4.0.0"
    resolved: true
    resolved_in: "4.0.0"
    workaround: "Use AI SDK Core functions (generateText, streamText, generateObject) instead of the old experimental_streamData. See migration guide."
    source: "https://sdk.vercel.ai/docs/migration-guides/migration-guide-3-to-4"
    first_reported: "2024-10-01"

  - id: "VAI-002"
    severity: "medium"
    category: "vendor_lock_in"
    frequency: "common"
    production_impact: "medium"
    description: "Vercel AI SDK is optimized for Vercel deployment. Self-hosting on other platforms (Railway, Fly.io) requires additional configuration for streaming to work correctly."
    affected_versions: ">=3.0.0"
    resolved: false
    workaround: "Set proper headers for streaming responses on your host. Vercel AI SDK is runtime-agnostic but streaming middleware varies by platform."
    source: "https://sdk.vercel.ai/docs/getting-started/nodejs"
    first_reported: "2024-03-01"

  - id: "VAI-003"
    severity: "medium"
    category: "server_side"
    frequency: "uncommon"
    production_impact: "medium"
    description: "Edge runtime restrictions on Vercel limit certain Node.js APIs. Some AI providers require Node.js runtime, not Edge runtime."
    affected_versions: ">=3.0.0"
    resolved: false
    workaround: "Set export const runtime = 'nodejs' in your Next.js route handlers when using providers that require Node.js APIs."
    source: "https://sdk.vercel.ai/docs/troubleshooting"
    first_reported: "2024-01-01"

compatible_with:
  - framework: "fastapi"
    strength: 0.70
    notes: "Vercel AI SDK frontend can call FastAPI Python backends for agent logic."
  - framework: "mastra"
    strength: 0.85
    notes: "Mastra handles backend agent orchestration; Vercel AI SDK handles streaming UI."
  - framework: "mcp_sdk_python"
    strength: 0.82
    notes: "Vercel AI SDK v4 MCP client connects to Python MCP servers."

