  notes: "Vercel AI SDK is the dominant TypeScript framework for building streaming AI UIs with Next.js. v4 added native MCP client support and a unified Core API (generateText, streamText, generateObject) that works across all LLM providers. Best for Next.js teams building user-facing AI products."
