known_issues:
  - id: "WNB-001"
    severity: "high"
    category: "latency"
    frequency: "common"
    production_impact: "medium"
    description: "W&B logging is synchronous by default and can add 50-200ms latency per log call in tight inference loops. High-frequency logging can bottleneck throughput."
    affected_versions: ">=0.12.0"
    resolved: false
    workaround: "Use wandb.init(settings=wandb.Settings(disable_git=True)) and log in batches. For LLM tracing, use Weave which is designed for async tracing."
    source: "curated"
    first_reported: "2023-05-01"

  - id: "WNB-002"
    severity: "medium"
    category: "llm_support"
    frequency: "common"
    production_impact: "medium"
    description: "wandb core SDK was not designed for LLM tracing. Use W&B Weave (separate product) for LLM/agent observability. Mixing wandb.log() with LLM calls requires careful design."
    affected_versions: ">=0.15.0"
    resolved: false
    workaround: "Use wandb.weave for LLM/agent tracing. Use wandb.log() only for experiment metrics (loss, accuracy). Keep the two separate."
    source: "https://weave-docs.wandb.ai"
    first_reported: "2024-01-01"

  - id: "WNB-003"
    severity: "low"
    category: "cost"
    frequency: "common"
    production_impact: "low"
    description: "W&B SaaS free tier limits storage and retention. Enterprise workloads with high artifact volume incur significant cost."
    affected_versions: ">=0.1.0"
    resolved: false
    workaround: "Use wandb.log(step=N) sparingly in production. Store large artifacts in S3 and log references. Consider W&B on-prem for cost control."
    source: "curated"
    first_reported: "2023-01-01"

