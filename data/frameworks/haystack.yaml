known_issues:
  - id: "HAY-001"
    severity: "critical"
    category: "api_change"
    frequency: "common"
    production_impact: "critical"
    description: "Haystack v2 is a complete rewrite of v1. v1 code is not compatible with v2. All Document Stores, Pipelines, and Nodes changed their APIs."
    affected_versions: "<2.0.0"
    resolved: true
    resolved_in: "2.0.0"
    workaround: "Follow the official Haystack v1→v2 migration guide. The Pipeline.run() API changed significantly."
    source: "https://docs.haystack.deepset.ai/docs/migration-guide-v1-to-v2"
    first_reported: "2024-03-01"

  - id: "HAY-002"
    severity: "high"
    category: "performance"
    frequency: "common"
    production_impact: "high"
    description: "Dense retrieval pipelines require embedding model inference which can be slow without GPU. Default BM25 retriever is CPU-only and does not scale beyond ~1M docs well."
    affected_versions: ">=2.0.0"
    resolved: false
    workaround: "Use Qdrant/Milvus Document Stores with pre-computed embeddings. Use async pipeline execution for throughput."
    source: "curated"
    first_reported: "2024-04-01"

  - id: "HAY-003"
    severity: "medium"
    category: "ecosystem"
    frequency: "uncommon"
    production_impact: "medium"
    description: "Haystack is less known than LangChain/LlamaIndex; community support and third-party integrations are smaller."
    affected_versions: ">=2.0.0"
    resolved: false
    workaround: "Use official deepset integrations for major providers. For niche integrations, consider LangChain as an alternative."
    source: "curated"
    first_reported: "2024-01-01"

compatible_with:
  - framework: "qdrant"
    strength: 0.92
    notes: "QdrantDocumentStore is a first-class Haystack integration with hybrid search support."
  - framework: "opentelemetry"
    strength: 0.85
    notes: "Haystack has native pipeline tracing compatible with OpenTelemetry."
  - framework: "fastapi"
    strength: 0.88
    notes: "Haystack pipelines run as async functions, integrating cleanly with FastAPI."

conflicts_with: []
supersedes: []
migrates_to:
  - framework: "langgraph"
    effort: 0.6
    notes: "LangGraph is more flexible for stateful agents; Haystack is more opinionated for RAG pipelines."

curation:
  status: "curated"
  last_validated: "2026-05-16"
  validated_by: "truearch-team"
  next_validation_due: "2026-06-16"
  sources:
    - "https://docs.haystack.deepset.ai"
    - "https://github.com/deepset-ai/haystack/releases"
  notes: "Haystack is the strongest RAG-native orchestrator — it was purpose-built for document question answering, hybrid search, and production RAG pipelines. The v2 rewrite made it async-native and composable. Best choice when the primary use case is document retrieval, not general agent orchestration."
