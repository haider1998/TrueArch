known_issues:
  - id: "ADK-001"
    severity: "medium"
    description: "Ecosystem immaturity — ADK is a relatively new framework (2025/2026). Production case studies are limited; community knowledge base is thin compared to LangGraph/CrewAI."
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Supplement with Google Cloud documentation and official samples; plan for more self-debugging time than with LangGraph"
    source: "https://github.com/google/adk-python"

  - id: "ADK-002"
    severity: "medium"
    description: "Multi-language support fragmentation — Python, Java, Go, TypeScript repos are separate with different feature parity. Java and Go lag behind Python in features."
    affected_versions: "all (non-Python)"
    resolved: false
    resolved_in: null
    workaround: "Use Python SDK for full feature parity; Java/Go/TS for specific integrations only"
    source: "https://github.com/google/adk-java"

  - id: "ADK-003"
    severity: "low"
    description: "GCP-native design creates soft lock-in — deepest integrations (Vertex AI, Cloud Logging, Cloud Trace) require GCP. Multi-cloud architectures require more abstraction work."
    affected_versions: "all"
    resolved: false
    resolved_in: null
    workaround: "Abstract GCP-specific integrations behind interfaces if multi-cloud is a requirement"
    source: "Community feedback"

