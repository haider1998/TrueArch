    - "https://github.com/google/adk-go"
    - "https://github.com/google/adk-java"
    - "https://google.github.io/adk-docs/"
  notes: |
    Verified May 2026: adk-python ~19,700 stars. Multi-repo structure (Python, Go, Java, TS).
    
    KEY DIFFERENTIATOR: ADK has NATIVE MCP support — the only major orchestration framework
    with first-class MCP integration built in. This is a significant signal for TrueArch's
    target users (MCP-native architecture is our D6 recommendation for new projects).
    
    Google-backed with strong growth (6.5%/mo). Very actively developed.
    Main concerns: ecosystem immaturity, GCP soft lock-in, non-Python SDK lag.
    
    TrueArch position: STRONG RECOMMENDATION for Google Cloud workloads and GCP-native teams.
    Highest agent_compatibility score for MCP-native architectures.
    Best for: new projects, GCP, Python, multi-agent, MCP-protocol stacks.
    Watch: Java/Go/TS feature parity — currently materially behind Python.
