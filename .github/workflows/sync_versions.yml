name: TrueArch Nightly Version Sync

on:
  schedule:
    - cron: '0 2 * * *'  # Run every night at 2 AM UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml
          
      - name: Run sync script
        run: python -m src.scripts.sync_versions
        
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/frameworks/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync framework versions [skip ci]" && git push)
